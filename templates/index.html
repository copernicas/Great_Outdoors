<!DOCTYPE html>
<html>
<head>
    <title>Welcome to the Great Outdoors!</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='styles/toplevel.css') }}">
    <script src="{{ url_for('static', filename='scripts/myscripts.js') }}"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #FAF0E6;
            margin: 20px;
            text-align: center;
        }
        .gallery {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 40px;
        }
        .gallery figure {
            margin: 0;
            text-align: center;
        }
        .gallery img {
            width: 400px;
            height: auto;
            border-radius: 10px;
        }
        /* Remove bullets from lists */
        ul {
            list-style-type: none;
            padding-left: 0;
        }
        #alttext {
            font-size: 50px;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Welcome to the Great Outdoors!</h1>

    <div class="gallery">
        <!-- Only image1.jpg, no caption -->
        <figure>
            <img src="{{ url_for('static', filename='images/image1.jpg') }}" 
                 alt="Image 1" 
                 onmouseover="showAlt(this)" 
                 onmouseout="hideAlt(this)">
        </figure>
    </div>

    <p id="alttext"></p>

    <ul>
        <li><a href="mountain.html">Climb the Mountain</a></li>
        <li><a href="forest.html">Wander the Forest</a></li>
        <li><a href="falls.html">See the Falls</a></li>
        <li><a href="ferry.html">Ride the Ferry</a></li>
        <li><a href="lake.html">Walk Around the Lake</a></li>
        <li><a href="park.html">Read in the Park</a></li>
    </ul>

    <!-- Add User Link -->
    <p>
        <a href="{{ url_for('add_user') }}">Add New User</a>
    </p>

    <!-- Display current users -->
    <h2>Current Users</h2>
    <ul>
        {% for user in users %}
            <li>{{ user.name }}</li>
        {% endfor %}
    </ul>

</body>
</html>
